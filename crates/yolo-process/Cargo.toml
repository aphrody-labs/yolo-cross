# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-process"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Portable process supervision, liveness, job control, and locking primitives for build and interoperability tools."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
serde = { version = "1.0.228" }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"

# Tokio process support is host-only; wasm32 has no process support.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", optional = true, features = ["full"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
